# Merkle Service Configuration
#
# This file configures all components of the merkle-service. Every value shown
# below is the built-in default. Override any setting here or via the
# corresponding environment variable (listed in comments).
#
# Priority order: environment variables > this file > built-in defaults.
#
# To use a custom file path, set CONFIG_FILE=/path/to/config.yaml

# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------

# Operating mode. "all-in-one" runs every service in a single process.
# "microservice" is for running individual components via cmd/<service-name>.
# Env: MODE
mode: all-in-one

# Log level. Controls minimum severity for all service loggers.
# Valid values: debug, info, warn, error
# Env: LOG_LEVEL
logLevel: info

# ---------------------------------------------------------------------------
# API Server
# ---------------------------------------------------------------------------
api:
  # HTTP listen port for the /watch and /health endpoints.
  # Env: API_PORT
  port: 8080

# ---------------------------------------------------------------------------
# Store — selects the persistence backend for every non-blob store
# ---------------------------------------------------------------------------
# backend: which store implementation to use.
#   aerospike (default): use the aerospike: block below. Production-recommended.
#   sql: use the store.sql: block. PostgreSQL and SQLite are supported.
# Env: STORE_BACKEND
store:
  backend: aerospike

  # SQL backend — only read when store.backend == sql.
  sql:
    # driver: postgres | sqlite
    # Env: STORE_SQL_DRIVER
    driver: postgres

    # DSN (driver-specific connection string).
    # postgres example: postgres://user:pass@host:5432/merkle?sslmode=disable
    # sqlite  example: file:/var/lib/merkle.db
    # Env: STORE_SQL_DSN
    dsn: ""

    # Optional schema name (postgres only). Empty means default search_path.
    # Env: STORE_SQL_SCHEMA
    schema: ""

    # Interval between TTL sweeper passes (Go duration; e.g. 30s, 1m).
    # Env: STORE_SQL_SWEEPER_INTERVAL
    sweeperInterval: 60s

    # Connection pool sizing.
    # Env: STORE_SQL_MAX_OPEN_CONNS, STORE_SQL_MAX_IDLE_CONNS
    maxOpenConns: 25
    maxIdleConns: 5

# ---------------------------------------------------------------------------
# Aerospike — registration store and seen-counter persistence
# (read only when store.backend == aerospike)
# ---------------------------------------------------------------------------
aerospike:
  # Aerospike cluster seed node. Single-seed form, kept for backward
  # compatibility. Production deployments should use `seeds:` instead so the
  # client can fall through to a live node when the configured seed is busy.
  # Env: AEROSPIKE_HOST
  host: localhost

  # List of seed node addresses. When non-empty, `host` is ignored. Pointing
  # the client at multiple seeds avoids hammering a single node's connection
  # pool during block-time fan-out.
  # Env: AEROSPIKE_SEEDS (comma-separated)
  seeds: []

  # Aerospike client port.
  # Env: AEROSPIKE_PORT
  port: 3000

  # Aerospike namespace for all merkle-service data.
  # Env: AEROSPIKE_NAMESPACE
  namespace: merkle

  # Aerospike set used to store txid -> callback URL registrations.
  # Env: AEROSPIKE_SET
  setName: merkle_registrations

  # Aerospike set used for per-txid seen counters (SEEN_MULTIPLE_NODES tracking).
  # Env: AEROSPIKE_SEEN_SET
  seenSet: merkle_seen_counters

  # Aerospike set used for callback delivery deduplication records.
  # Env: AEROSPIKE_CALLBACK_DEDUP_SET
  callbackDedupSet: merkle_callback_dedup

  # Aerospike set used for subtree completion counters (BLOCK_PROCESSED coordination).
  # Env: AEROSPIKE_SUBTREE_COUNTER_SET
  subtreeCounterSet: merkle_subtree_counters

  # TTL in seconds for subtree counter records. Should exceed maximum block processing time.
  # Env: AEROSPIKE_SUBTREE_COUNTER_TTL_SEC
  subtreeCounterTTLSec: 600

  # Aerospike set storing, per (block, callbackURL), the set of subtree indices
  # that produced a STUMP — surfaced on BLOCK_PROCESSED so the receiver can
  # detect a missing STUMP. Shares subtreeCounterTTLSec (same lifetime: both
  # live only until the block is fully processed).
  # Env: AEROSPIKE_EXPECTED_STUMP_SET
  expectedStumpSet: merkle_expected_stumps

  # Aerospike set used for cross-subtree callback accumulation (batching MINED messages).
  # Env: AEROSPIKE_CALLBACK_ACCUMULATOR_SET
  callbackAccumulatorSet: merkle_callback_accum

  # TTL in seconds for callback accumulation records. Should match subtree counter TTL.
  # Env: AEROSPIKE_CALLBACK_ACCUMULATOR_TTL_SEC
  callbackAccumulatorTTLSec: 600

  # Maximum number of retries for transient Aerospike errors.
  # Env: AEROSPIKE_MAX_RETRIES
  maxRetries: 3

  # Base delay in milliseconds between Aerospike retries (used with backoff).
  # Env: AEROSPIKE_RETRY_BASE_MS
  retryBaseMs: 100

  # Per-node connection pool size. The Aerospike Go client default is 100;
  # block-time BatchGet fan-out (one call per subtree, up to 30+ in parallel)
  # can drain a 100-conn pool fast and produce
  # "connection pool is empty" timeouts that drop STUMPs.
  # Env: AEROSPIKE_CONNECTION_QUEUE_SIZE
  connectionQueueSize: 256

  # Pre-warm the pool with this many connections per node so the first burst
  # after idle doesn't pay dial cost. Aerospike server's proto-fd-idle-ms
  # must be raised in lockstep or the server will reap warm connections.
  # Env: AEROSPIKE_MIN_CONNECTIONS_PER_NODE
  minConnectionsPerNode: 16

  # When false, transient bursts may temporarily exceed connectionQueueSize
  # (extras are closed when returned). Set true to enforce a hard cap.
  # Env: AEROSPIKE_LIMIT_CONNECTIONS_TO_QUEUE_SIZE
  limitConnectionsToQueueSize: false

  # Per-attempt socket timeout (ms) applied to every BatchGet/Operate. Without
  # this, the client default leaves slow operations dangling far longer than
  # the per-call SLA arcade expects.
  # Env: AEROSPIKE_SOCKET_TIMEOUT_MS
  socketTimeoutMs: 5000

  # Overall deadline for a single batch operation across all retries (ms).
  # Env: AEROSPIKE_TOTAL_TIMEOUT_MS
  totalTimeoutMs: 15000

  # How many cluster nodes a single BatchGet/BatchOperate fans out to
  # concurrently. The Aerospike Go client defaults this to 1, issuing each
  # owning node's sub-batch serially on the calling goroutine — so a batch
  # whose keys span M nodes costs M sequential round-trips. On the SEEN/MINED
  # read path that serialization is the dominant per-subtree database cost.
  #   0  = all owning nodes concurrently (one parallel fan-out) — default
  #   1  = serial, one node at a time (the Aerospike library default)
  #   >1 = up to N nodes concurrently
  # On a large cluster, bound this (e.g. 8) if wide fan-out from many partition
  # workers at once pushes the per-node pool (connectionQueueSize) under
  # pressure. Retries do NOT re-fan-out (batch MaxRetries is 0).
  # Env: AEROSPIKE_BATCH_CONCURRENT_NODES
  batchConcurrentNodes: 0

  # How many of a single batch operation's 5000-key chunks are issued
  # concurrently (registration BatchGet, seen-counter BatchIncrement). A
  # teranode-default subtree (~1M txids) splits into ~210 chunks; serially that
  # is ~210 sequential round-trips on one goroutine — the dominant SEEN/MINED
  # read-path latency.
  #   0 or 1 = serial, one chunk at a time (prior behaviour)
  #   >1     = up to N chunks in flight at once
  # Connection budget: this multiplies with batchConcurrentNodes and the
  # caller's own concurrency (block.batchGetConcurrency, or active consumer
  # partitions on the SEEN fetcher). Peak in-flight node connections ≈
  # callerConcurrency × batchChunkConcurrency × nodes — keep under
  # connectionQueueSize, or bound this on large clusters.
  # Env: AEROSPIKE_BATCH_CHUNK_CONCURRENCY
  batchChunkConcurrency: 8

# ---------------------------------------------------------------------------
# Kafka — async messaging between services
# ---------------------------------------------------------------------------
kafka:
  # Comma-separated list of Kafka broker addresses.
  # Env: KAFKA_BROKERS (comma-separated)
  brokers:
    - localhost:9092

  # Topic for subtree messages published by the P2P client.
  # Env: KAFKA_SUBTREE_TOPIC
  subtreeTopic: subtree

  # Topic for block messages published by the P2P client.
  # Env: KAFKA_BLOCK_TOPIC
  blockTopic: block

  # Topic for callback messages (SEEN_ON_NETWORK, STUMP, BLOCK_PROCESSED, etc.).
  # Env: KAFKA_CALLBACK_TOPIC
  callbackTopic: callback

  # Dead-letter queue topic for permanently failed callback deliveries.
  # Env: KAFKA_CALLBACK_DLQ_TOPIC
  callbackDlqTopic: callback-dlq

  # Topic for subtree work items dispatched by the block processor for parallel processing.
  # Env: KAFKA_SUBTREE_WORK_TOPIC
  subtreeWorkTopic: subtree-work

  # Dead-letter topic for subtree work items that exceed block.maxAttempts.
  # On DLQ hand-off the subtree counter is still decremented so BLOCK_PROCESSED
  # fires (with a missing STUMP that arcade surfaces as a BUMP build error).
  # Env: KAFKA_SUBTREE_WORK_DLQ_TOPIC
  subtreeWorkDlqTopic: subtree-work-dlq

  # Kafka consumer group ID shared across service instances.
  # Env: KAFKA_CONSUMER_GROUP
  consumerGroup: merkle-service

  # Partition counts for the two topics that carry independent, per-subtree work
  # units with no ordering requirement. More partitions = more subtrees a stage
  # can fetch/build in parallel (a consumer group runs one in-order worker per
  # partition). Created at this width on first start, and grown to it on later
  # starts if the topic already exists narrower (partition counts only ever
  # increase). The 'block' and 'callback' topics are intentionally fixed at 1
  # partition and are not configurable here — 'block' is low-rate, and 'callback'
  # depends on single-partition ordering to keep BLOCK_PROCESSED behind its
  # STUMPs. Widening 'callback' stays deferred until the expectedSubtreeIndices
  # completeness check is verified end-to-end in arcade — rollout step 4 of
  # docs/block-processed-completeness.md (which supersedes the earlier
  # callback-topic-partition-design.md, no longer in the repo).
  # Env: KAFKA_SUBTREE_PARTITIONS
  subtreePartitions: 12
  # Env: KAFKA_SUBTREE_WORK_PARTITIONS
  subtreeWorkPartitions: 24

  # retention.ms applied when THIS service creates a topic (work topics and
  # DLQ topics respectively). Applied at CREATE time only — existing topics
  # are never altered, so GitOps-managed Topic CRDs stay authoritative.
  # Without an explicit value, a fresh cluster's broker default applies
  # silently (some clusters default to minutes, silently expiring queued work
  # and dead letters). Defaults: 6 hours for work topics, 7 days for DLQs.
  # Env: KAFKA_TOPIC_RETENTION_MS
  topicRetentionMs: 21600000
  # Env: KAFKA_DLQ_RETENTION_MS
  dlqRetentionMs: 604800000

# ---------------------------------------------------------------------------
# P2P — Teranode network connectivity via go-teranode-p2p-client
# ---------------------------------------------------------------------------
p2p:
  # BSV network to connect to. The go-teranode-p2p-client library automatically
  # configures topics, bootstrap peers, and protocol version based on this value.
  # Valid values: main, test, stn, teratestnet
  # Env: P2P_NETWORK
  network: teratestnet

  # Directory for persisting the P2P identity key and peer cache.
  # The library manages key generation and peer persistence automatically.
  # Env: P2P_STORAGE_PATH
  storagePath: ~/.merkle-service/p2p

# ---------------------------------------------------------------------------
# Subtree Processor
# ---------------------------------------------------------------------------
subtree:
  # When to store subtree data in the blob store.
  #   "realtime" — store immediately when subtree is received from P2P
  #   "deferred" — store during block processing instead
  # Env: SUBTREE_STORAGE_MODE
  storageMode: realtime

  # Delete-at-height offset for subtree blob expiry.
  # A value of 1 means subtrees are pruned after the next block.
  # Env: SUBTREE_DAH_OFFSET
  dahOffset: 1

  # Delete-at-height offset for STUMP blob expiry. STUMP payloads are stored in
  # the blob store (claim-check pattern) and referenced by Kafka callback
  # messages. Must outlive the callback retry window
  # (callback.maxRetries * callback.backoffBaseSec) plus a margin for brief
  # blob-store outages. Default of 6 blocks (~1 hour) covers the defaults with
  # generous headroom.
  # Env: SUBTREE_STUMP_DAH_OFFSET
  stumpDahOffset: 6

  # Maximum memory (MB) for the registration deduplication cache (txmetacache).
  # Reduces Aerospike load by caching recently-checked txid registration results.
  # Env: SUBTREE_CACHE_MAX_MB
  cacheMaxMB: 64

  # Maximum number of processed subtree hashes to track for message deduplication.
  # Prevents reprocessing of subtrees already successfully handled.
  # Env: SUBTREE_DEDUP_CACHE_SIZE
  dedupCacheSize: 100000

  # Base delay (ms) before a transient subtree failure is re-published for
  # retry; doubles per attempt, capped at 30s, so the bounded retry budget
  # spans real time instead of burning out in milliseconds. 0 disables the
  # backoff (not recommended in production).
  # Env: SUBTREE_RETRY_BACKOFF_BASE_MS
  retryBackoffBaseMs: 1000

  # Caps how many matched txids are included (as a "txids" array) on the Info
  # log emitted for each SEEN_ON_NETWORK / SEEN_MULTIPLE_NODES batch published
  # to a callback URL. A batch exceeding this cap still logs, but with only
  # the first seenTxidLogMax txids and "txids_truncated": true. Set to 0 to
  # log batch counts only (omits the txids array entirely) — useful when
  # batches routinely carry thousands of txids and the full list would
  # dominate log volume.
  # Env: SUBTREE_SEEN_TXID_LOG_MAX
  seenTxidLogMax: 1000

# ---------------------------------------------------------------------------
# Block Processor
# ---------------------------------------------------------------------------
block:
  # Number of parallel workers for processing subtrees within a block.
  # Each worker retrieves a subtree, checks registrations, and builds STUMPs.
  # Env: BLOCK_WORKER_POOL_SIZE
  workerPoolSize: 16

  # TTL in seconds applied to registration records after their block is processed.
  # Allows time for fork/orphan handling before Aerospike evicts the record.
  # Default: 1800 (30 minutes).
  # Env: BLOCK_POST_MINE_TTL_SEC
  postMineTTLSec: 1800

  # Maximum number of processed block hashes to track for message deduplication.
  # Prevents reprocessing of blocks already successfully handled.
  # Env: BLOCK_DEDUP_CACHE_SIZE
  dedupCacheSize: 10000

  # Maximum number of attempts per subtree work item before routing to the
  # subtree-work-dlq topic. Transient Aerospike/DataHub failures replay the
  # work item back onto subtree-work with AttemptCount+1; this caps how long
  # a permanently broken subtree can stall block completion.
  # Env: BLOCK_MAX_ATTEMPTS
  maxAttempts: 10

  # Base delay (ms) before a transiently-failed subtree work item is
  # re-published for retry; doubles per attempt, capped at 5s (deliberately
  # below the fetcher's 30s cap — see subtree.retryBackoffBaseMs — so a
  # failing 50-record consumer chunk cannot sleep past the group's 5m
  # rebalance timeout). Without it the whole maxAttempts budget burns in
  # milliseconds per item, amplifying dependency outages with immediate
  # republish storms. 0 disables the backoff (not recommended in production).
  # Env: BLOCK_RETRY_BACKOFF_BASE_MS
  retryBackoffBaseMs: 1000

  # Reduced retry budget for work items failing with a DataHub 404. Worker
  # subtrees existed at announcement time, but teranode's asset cache prunes
  # subtree data after ~2h, so a late 404 is effectively permanent — it DLQs
  # after this many attempts instead of burning the full maxAttempts budget.
  # maxAttempts remains a hard ceiling regardless.
  # Env: BLOCK_NOT_FOUND_MAX_ATTEMPTS
  notFoundMaxAttempts: 3

  # Memory (MB) for the block-time registration deduplication cache. Same
  # shape as subtree.cacheMaxMB but independent so all-in-one and microservice
  # topologies behave identically. 0 disables.
  # Env: BLOCK_REG_CACHE_MAX_MB
  regCacheMaxMB: 64

  # Maximum concurrent registration BatchGet calls per worker process. Without
  # a gate, a single block can fire one BatchGet per subtree (up to 30+) in
  # parallel and exhaust the Aerospike connection pool. 0 disables the gate.
  # Env: BLOCK_BATCH_GET_CONCURRENCY
  batchGetConcurrency: 4

  # Record the per-(block, callbackURL) set of subtree indices that produced a
  # STUMP and attach it to BLOCK_PROCESSED as expectedSubtreeIndices, so the
  # receiver can detect a missing STUMP (docs/block-processed-completeness.md).
  # Default TRUE — deliberately diverging from that doc's original "default
  # off" rollout plan: the feature has been unconditionally live in production
  # since v0.4.5 and its write load is already absorbed, so this flag is an
  # emergency off-switch, not a rollout gate. Disabling turns off BOTH the
  # recording and the attach together — attaching a set that was never written
  # would be an empty set, telling the receiver to expect zero STUMPs (silent
  # loss).
  # Env: BLOCK_EMIT_EXPECTED_STUMP_SET
  emitExpectedStumpSet: true

# ---------------------------------------------------------------------------
# Callback Delivery
# ---------------------------------------------------------------------------
callback:
  # Maximum number of delivery attempts per callback before sending to the DLQ.
  # Env: CALLBACK_MAX_RETRIES
  maxRetries: 5

  # Base delay in seconds for linear retry backoff.
  # Actual delay = backoffBaseSec * retryCount (e.g., 30s, 60s, 90s, ...).
  # Env: CALLBACK_BACKOFF_BASE_SEC
  backoffBaseSec: 30

  # HTTP request timeout in seconds for each callback delivery attempt.
  # Env: CALLBACK_TIMEOUT_SEC
  timeoutSec: 10

  # Number of unique subtrees a txid must appear in before emitting
  # a SEEN_MULTIPLE_NODES callback. Tracks network propagation confidence.
  # Env: CALLBACK_SEEN_THRESHOLD
  seenThreshold: 3

  # TTL in seconds for callback delivery deduplication records in Aerospike.
  # After expiry, a very late duplicate could be redelivered. Default: 86400 (24 hours).
  # Env: CALLBACK_DEDUP_TTL_SEC
  dedupTTLSec: 86400

  # Maximum concurrent HTTP connections per callback endpoint.
  # Env: CALLBACK_MAX_CONNS_PER_HOST
  maxConnsPerHost: 32

  # Maximum idle HTTP connections kept alive per callback endpoint.
  # Env: CALLBACK_MAX_IDLE_CONNS_PER_HOST
  maxIdleConnsPerHost: 16

  # SSRF guard escape hatch. When false (the default), callback URLs that
  # resolve to loopback (127.0.0.0/8, ::1), link-local (169.254.0.0/16,
  # fe80::/10), or RFC1918 (10/8, 172.16/12, 192.168/16) addresses are
  # rejected at /watch registration AND the callback delivery client
  # refuses to dial them. Cloud metadata hostnames (metadata.google.internal,
  # 169.254.169.254) are always blocked. Set to true ONLY if you need to
  # deliver to internal services on purpose (e.g. local testing,
  # in-cluster sidecars). The service logs a warning at startup when this
  # is enabled.
  # Env: CALLBACK_ALLOW_PRIVATE_IPS
  allowPrivateIPs: false

# ---------------------------------------------------------------------------
# Blob Store — subtree data storage
# ---------------------------------------------------------------------------
blobStore:
  # Backend URL for subtree blob storage. Exactly two schemes are supported:
  #   file://<path>  — durable on-disk store rooted at <path>. The path is
  #                    created if missing. This is the only durable backend.
  #   memory:        — in-memory store. Tests / ephemeral single-process
  #                    deployments only; blobs are lost on restart and are
  #                    not visible to other replicas.
  # Any other scheme (s3://, gs://, http://, or a typo such as flie://) is
  # rejected at startup — there is no silent fallback to in-memory.
  # Examples:
  #   file:///var/lib/merkle-subtrees
  #   memory:
  # Env: BLOB_STORE_URL
  url: file:///mnt/nvme/merkle-subtreestore

  # Age sweeper (file:// stores only; runs in the block-processor ONLY — the
  # single replica that already executes delete-at-height prunes on the
  # shared volume, so one sweeper covers every service without a per-replica
  # stampede). A subtree blob only gets a delete-at-height schedule when its
  # subtree-work item completes; items that never complete (queue trimmed
  # during incident recovery, long-term parking, crash between store and
  # schedule) orphan their blobs FOREVER. On dev-ovh-1 (2026-07-15) those
  # orphans plus zero-byte ENOSPC litter filled a 1TiB volume in ~3h while
  # steady state holds ~2 blocks ≈ 26GB. Subtree blobs are a re-fetchable
  # cache (DataHub re-serves them; the miss path carried a whole block at
  # 100% miss rate), so aggressive age GC is safe — the sweeper removes ONLY
  # top-level 64-lowercase-hex subtree blobs plus zero-byte litter older
  # than ~5min. STUMP blobs (under stump/) are never age-swept: callback
  # delivery reads them at delivery time with retry windows up to ~1h.
  # .dah/ bookkeeping is never touched.
  #
  # How often the sweeper walks the store. 0 disables the sweeper.
  # Env: BLOB_STORE_SWEEP_INTERVAL_SEC
  sweepIntervalSec: 300
  # Age after which an orphaned subtree blob is removed. Default 1800 ≈ 3
  # blocks at ~10min cadence. Nonzero values below 600 are rejected at
  # startup — a sweep age under one block interval could delete the
  # in-flight block's blobs mid-processing. 0 disables age sweeping.
  # Env: BLOB_STORE_SWEEP_MAX_AGE_SEC
  sweepMaxAgeSec: 1800

# ---------------------------------------------------------------------------
# DataHub — HTTP client for fetching subtree/block data from Teranode
# ---------------------------------------------------------------------------
datahub:
  # HTTP request timeout in seconds for DataHub requests.
  # Env: DATAHUB_TIMEOUT_SEC
  timeoutSec: 30

  # Maximum number of retries for failed DataHub requests.
  # Env: DATAHUB_MAX_RETRIES
  maxRetries: 3

  # Maximum response body size for /block/<hash> requests, in bytes.
  # Block metadata is small (header + subtree-hash list), so the default
  # 16 MiB leaves ~100x headroom. A hostile or malfunctioning DataHub
  # returning more than this is rejected without buffering the whole body.
  # Set <= 0 to use the built-in default. Mitigates F-027.
  # Env: DATAHUB_MAX_BLOCK_BYTES
  maxBlockBytes: 16777216

  # Maximum response body size for /subtree/<hash> requests, in bytes.
  # DataHub subtrees are concatenated 32-byte hashes; the default 1 GiB
  # accommodates ~33.5M txids. Operators running with smaller subtree-size
  # limits should tune this down. Set <= 0 to use the built-in default.
  # Env: DATAHUB_MAX_SUBTREE_BYTES
  maxSubtreeBytes: 1073741824

  # Peer-health breaker: after failureThreshold consecutive attributed
  # failures against a peer's host, its announcements are ack-and-dropped
  # for cooldownSec. Caller cancellations are never attributed, and 404s on
  # subtree announcements older than stale404GraceSec are attributed to our
  # own consumer lag (teranode's asset cache holds subtree data ~2h) rather
  # than the peer — the 2026-07-15 dev-ovh-1 incident showed both
  # mis-attributions keeping the breaker open indefinitely in a single-peer
  # topology. Breaker state is visible via merkle_datahub_peer_healthy and
  # merkle_datahub_peer_unhealthy_transitions_total.
  peerHealth:
    # Consecutive attributed failures before a peer host is marked
    # unhealthy. <= 0 selects the built-in default (3).
    # Env: DATAHUB_PEER_HEALTH_FAILURE_THRESHOLD
    failureThreshold: 3

    # Seconds a peer stays unhealthy once tripped; expiry is checked lazily.
    # <= 0 selects the built-in default (300).
    # Env: DATAHUB_PEER_HEALTH_COOLDOWN_SEC
    cooldownSec: 300

    # Announcement age (seconds, from the message's announcedAtUnixMs stamp)
    # beyond which a subtree-fetch 404 is treated as consumer lag and NOT
    # counted against the peer. The message still routes to the DLQ; only
    # peer attribution changes. Unstamped messages are treated as fresh.
    # <= 0 selects the built-in default (3600).
    # Env: DATAHUB_PEER_HEALTH_STALE404_GRACE_SEC
    stale404GraceSec: 3600

# ---------------------------------------------------------------------------
# Registry — policy for the txid -> callback URL registration store.
# (applies regardless of whether the backend is Aerospike or SQL)
# ---------------------------------------------------------------------------
registry:
  # Maximum number of distinct callback URLs that may be registered against
  # a single txid. Once reached, further /watch calls for the same txid
  # return HTTP 429. Re-registering an already-known URL is idempotent and
  # is unaffected by the cap. 0 disables the cap (legacy unbounded
  # behavior — strongly discouraged in production; see F-050).
  # Env: REGISTRY_MAX_CALLBACKS_PER_TXID
  maxCallbacksPerTxID: 10

# ---------------------------------------------------------------------------
# Metrics — Prometheus /metrics exporter
# ---------------------------------------------------------------------------
# Each binary that runs services (api-server, block-processor,
# callback-delivery, subtree-fetcher, subtree-worker, p2p-client,
# all-in-one) starts a dedicated metrics HTTP server on port. In all-in-one
# mode a single server is shared across the in-process services via the
# package-level metrics.Registry. Operators running multiple sub-binaries on
# the same host MUST override port per-binary to avoid bind conflicts.
metrics:
  # Enable the Prometheus /metrics HTTP endpoint.
  # Env: METRICS_ENABLED
  enabled: true

  # HTTP listen port for the metrics endpoint.
  # Env: METRICS_PORT
  port: 9090

  # URL path the metrics endpoint is served on.
  # Env: METRICS_PATH
  path: /metrics

# ---------------------------------------------------------------------------
# Telemetry — OpenTelemetry export to an external OTLP collector
# ---------------------------------------------------------------------------
# Traces + metrics only (no logs — stdout JSON, per logLevel above, remains
# the only log path; OTLP log export is not implemented). Metrics are bridged
# from the same private Prometheus registry the /metrics endpoint above
# serves, so both exporters stay in sync without duplicating instrumentation.
#
# Disabled by default: with enabled=false, no OTEL providers are created and
# no network connections are opened, so runtime behaviour is identical to a
# build with no OTEL support at all.
#
# endpoint may be left blank when enabled=true: the exporters then fall back
# to the standard OTEL_EXPORTER_OTLP_ENDPOINT (or the more specific
# OTEL_EXPORTER_OTLP_TRACES_ENDPOINT / OTEL_EXPORTER_OTLP_METRICS_ENDPOINT)
# environment variables, e.g. for a node-local collector reached via the
# Kubernetes downward API host IP:
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://$(HOST_IP):4317
# telemetry:
#   # Env: TELEMETRY_ENABLED
#   enabled: false
#
#   # host:port of the OTLP collector. May be left empty (see above). Must
#   # be host:port WITHOUT a scheme for both protocols (a scheme-prefixed URL
#   # is only understood by OTEL_EXPORTER_OTLP_ENDPOINT); for http, TLS is
#   # controlled by the insecure flag below, not by an http:// vs https://
#   # prefix.
#   # Env: TELEMETRY_ENDPOINT
#   endpoint: ""
#
#   # "grpc" (default, typically port 4317) or "http" (typically port 4318).
#   # Env: TELEMETRY_PROTOCOL
#   protocol: grpc
#
#   # Skip TLS when dialing the collector (e.g. an in-cluster/local collector
#   # reachable without TLS).
#   # Env: TELEMETRY_INSECURE
#   insecure: false
#
#   # service.name resource attribute. OTEL_SERVICE_NAME, if set, wins.
#   # Env: TELEMETRY_SERVICE_NAME
#   serviceName: merkle-service
#
#   # service.namespace resource attribute (e.g. the downstream solution's
#   # name). Omitted from the resource when empty.
#   # Env: TELEMETRY_NAMESPACE
#   namespace: ""
#
#   # Enable the OTLP trace pipeline.
#   # Env: TELEMETRY_TRACES
#   traces: true
#
#   # Enable the OTLP metric pipeline (Prometheus bridge).
#   # Env: TELEMETRY_METRICS
#   metrics: true
#
#   # ParentBased(TraceIDRatioBased) sampler ratio, 0.0-1.0.
#   # Env: TELEMETRY_SAMPLE_RATIO
#   sampleRatio: 1.0
#
#   # Bounds the final ForceFlush+Shutdown of every provider at process exit.
#   # Env: TELEMETRY_EXPORT_TIMEOUT_MS
#   exportTimeoutMs: 10000
