# API Server Deployment + Service
#
# Scaling: Stateless HTTP server. Scale replicas based on request volume.
# Each replica handles /watch (registration) and /health endpoints.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: merkle-service
  labels:
    app.kubernetes.io/name: api-server
    app.kubernetes.io/part-of: merkle-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-server
        app.kubernetes.io/part-of: merkle-service
    spec:
      containers:
        - name: api-server
          image: merkle-service:latest
          command: ["api-server"]
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: merkle-service-env
                optional: true
          # OTel telemetry wiring (reference only — the authoritative prod
          # values, including flipping TELEMETRY_ENABLED to "true", are set
          # by the bsva-infra-flux repo). HOST_IP/POD_NAME come from the k8s
          # downward API since ConfigMap-sourced envFrom can't supply them.
          # See docs/observability.md#deployment--enabling-telemetry.
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://$(HOST_IP):4317"
            - name: TELEMETRY_ENABLED
              value: "false"
            # Inbound bearer token required on POST /reprocess (issue #204).
            # Sourced from the api-server-auth Secret. optional: true keeps the
            # endpoint fail-open (unauthenticated) until an operator creates the
            # Secret with a real token — matching the phased-rollout design so an
            # arcade client without merkle_service.auth_token isn't broken by the
            # upgrade itself. Set the token to START enforcing.
            - name: API_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: api-server-auth
                  key: authToken
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: merkle-service-config
---
apiVersion: v1
kind: Service
metadata:
  name: api-server
  namespace: merkle-service
  labels:
    app.kubernetes.io/name: api-server
    app.kubernetes.io/part-of: merkle-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-server
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
---
# Placeholder Secret for the POST /reprocess bearer token (issue #204).
#
# Committed EMPTY on purpose: the real token must NOT live in a GitOps-tracked
# manifest. Provision it out-of-band (sealed-secret / external-secrets / manual
# `kubectl create secret generic api-server-auth --from-literal=authToken=...`)
# and keep the value in sync with each arcade client's merkle_service.auth_token.
# While this Secret is absent or the key is empty, the api-server logs a warning
# and serves /reprocess unauthenticated (fail-open) — see APIConfig.AuthToken.
apiVersion: v1
kind: Secret
metadata:
  name: api-server-auth
  namespace: merkle-service
  labels:
    app.kubernetes.io/name: api-server
    app.kubernetes.io/part-of: merkle-service
type: Opaque
stringData:
  authToken: ""
